:root{
--wk:"LXGW WenKai","LXGW WenKai Fallback","SimSun-ExtB","MingLiU-ExtB","MiSans L3","I.Ming","HanaMinB","BabelStone Han","Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,"SimSun",serif;
--ui:"LXGW WenKai","LXGW WenKai Fallback","SimSun-ExtB","MingLiU-ExtB","MiSans L3","I.Ming","HanaMinB","BabelStone Han",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
--ipa:"LXGW WenKai","LXGW WenKai Fallback",Georgia,"Times New Roman",serif;
--mono:"LXGW WenKai","LXGW WenKai Fallback","SFMono-Regular",Consolas,"Courier New",monospace}

:root{--ink:#1c1f23;--ink2:#5a6470;--ink3:#8b95a1;--line:#dfe4ea;--line2:#eef1f5;
--bg:#fbfcfd;--card:#fff;--yin:#e8f2fb;--yinb:#5b9bd5;--yang:#e9f6ee;--yangb:#4aa96c;
--ru:#fdeeea;--rub:#e07a5f;--te:#fdf6e3;--teb:#c2a24a;--sys:#3f6fa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:var(--wk);
 font-size:14.5px;line-height:1.75}
.wrap{max-width:1500px;margin:0 auto;padding:26px 22px 90px;position:relative}
header.top{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
h1{font-size:29px;margin:0 0 6px;letter-spacing:.06em;padding-right:150px}
h1 small{font-size:13.5px;color:var(--ink2);font-weight:400;letter-spacing:0}
.sub{color:var(--ink2);font-size:13.5px;margin:4px 0;padding-right:150px}
.sub a{color:var(--yinb);text-decoration:none;border-bottom:1px dotted var(--yinb)}
h2{font-size:20px;margin:30px 0 12px;padding-left:10px;border-left:4px solid var(--ink);
 letter-spacing:.04em}
h2 small{font-weight:400;font-size:13px;color:var(--ink2);margin-left:8px;letter-spacing:0}
h2.cstitle{padding:6px 12px;border-left-width:6px;border-radius:0 8px 8px 0}
h2.cls-shu{background:#eef4fa;border-left-color:var(--sys)}
h2.cls-ru{background:var(--ru);border-left-color:var(--rub)}
h2.cls-te{background:var(--te);border-left-color:var(--teb)}
section.broad{margin-bottom:44px}
p.broadnote{margin:2px 0 6px;font-size:13.5px;color:var(--ink2);background:#f6f8fb;
 border-left:3px solid var(--line);padding:8px 12px;border-radius:0 6px 6px 0}
h3.subcls{font-size:15.5px;margin:26px 0 2px;padding:4px 12px;border-radius:0 6px 6px 0;
 letter-spacing:.08em;font-weight:700}
h3.subcls small{font-weight:400;font-size:12px;color:var(--ink2);letter-spacing:0}
h3.subcls.cls-yin{background:var(--yin);border-left:5px solid var(--yinb)}
h3.subcls.cls-yang{background:var(--yang);border-left:5px solid var(--yangb)}
h3.rname{font-size:17.5px;margin:30px 0 4px;letter-spacing:.05em;scroll-margin-top:12px}
h3.rname small{font-size:12.5px;color:var(--ink2);font-weight:400}
p.rsrc{margin:0 0 10px;font-size:12.5px;color:var(--ink2);
 font-family:var(--ui)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;
 padding:8px 14px;min-width:106px}
.stat b{display:block;font-size:21px;line-height:1.25}
.stat span{font-size:12px;color:var(--ink2);
 font-family:var(--ui)}
.prose{background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:14px 16px 14px 36px;margin:12px 0;font-size:13.8px}
.prose li{margin:8px 0}
.prose p{margin:8px 0}
code{background:#f2f5f8;border:1px solid var(--line2);border-radius:4px;padding:0 4px;
 font-family:var(--mono);font-size:12.5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%}
table.fenyun th,table.fenyun td,table.units th,table.units td{
 border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);
 padding:4px 7px;font-size:12.5px;vertical-align:top;text-align:center;
 font-family:var(--ui)}
table.fenyun thead th,table.units thead th{background:#f3f6f9;font-weight:600;
 position:sticky;top:0;z-index:3;white-space:nowrap}
table.fenyun td.core,table.units td.core{font-family:var(--ipa);color:var(--ink2);
 white-space:nowrap}
table.fenyun th.rn a,table.units th.rn a{font-family:var(--wk);
 font-size:16px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
td.yes{background:#f8fbf9}
td.yes .hu-t{display:block;font-size:11px;color:var(--ink3)}
td.no{color:#c7ced6;background:#fafbfc}
.ipa{color:var(--ink2);font-family:var(--ipa)}
td.lab{font-family:var(--wk);font-size:15px;white-space:nowrap}
td.lab .rd{display:block;font-family:var(--ipa);font-size:11px;color:var(--ink3)}
td.num{color:var(--ink2)}
td.hu{white-space:nowrap;font-weight:600}
td.fin,td.rn{white-space:nowrap}
td.fin{font-weight:700}
tr.div td{background:#e9eef4;color:#3f4a56;font-weight:600;font-size:12px;
 text-align:left;padding:5px 10px;letter-spacing:.06em;
 font-family:var(--ui)}
button.cnt,button.sys{border-radius:9px;cursor:pointer;font-size:11px;padding:0 7px;
 margin:2px 2px 0;line-height:17px;
 font-family:var(--ui)}
button.cnt{border:1px solid #d5dee8;background:#f4f8fc;color:#3a6a99}
button.sys{border:1px solid #e2d6c0;background:#fdf8ef;color:#96702c}
button.cnt:hover{background:#e6f0fa;border-color:#9fc2e2}
button.sys:hover{background:#f8eed9;border-color:#d9bd85}
.mhint{font-size:13px;color:var(--ink2);margin:2px 0 6px;
 font-family:var(--ui)}
table.mtbl{width:100%;border-collapse:collapse;
 font-family:var(--ui)}
table.mtbl tr.msysrow{cursor:pointer}
table.mtbl tr.msysrow:hover{background:#f2f8ff}
table.mtbl tr.msysrow td{border-bottom:1px solid var(--line2)}
table.mtbl td{border-bottom:1px solid var(--line2);padding:5px 8px;font-size:12.8px;
 vertical-align:top}
table.mtbl td.mi{width:96px;white-space:nowrap;color:var(--ink2);font-family:var(--ipa)}
table.mtbl td.mp{width:180px;white-space:nowrap;font-family:var(--ipa);color:#3a6a99}
table.mtbl td.mc{font-family:var(--wk);font-size:15.5px;line-height:1.9;
 letter-spacing:.18em;word-break:break-all}
table.mtbl td.mn{width:88px;text-align:right;color:var(--ink3);font-size:11.5px;
 white-space:nowrap}
table.mtbl .dim{color:var(--ink3);font-size:13px}

<script id="i18n" type="application/json">{"wu":{"page_title":"蘇滬混合腔韻圖","h1":"蘇滬混合腔韻圖","tagline":"按今音韻基分韻，開合齊撮逐位列出，一位一圖","based_on":"依據 SiqYin 的 {dict}（字音查詢）與 {rime} 編製。本頁收字 <b>{chars}</b>，讀音條目 <b>{records}</b>，合法音節（含聲調）<b>{syll}</b>。","link_dict":"蘇滬混合腔線上字典","link_rime":"RIME 輸入方案","btn_sync":"重新同步線上字音庫","btn_expand":"全部展開韻圖","btn_collapse":"全部收合韻圖","btn_top":"回到頂端","btn_hide":"隱藏全空的聲母行","btn_show":"顯示全空的聲母行","sync_loading":"正在讀取線上字音庫……","sync_ok":"已同步線上字音庫（{link}）：收字 <b>{chars}</b>，讀音 <b>{records}</b> 條，合法音節 <b>{syll}</b> 個{stamp}。字音查詢那邊一有更新，重新整理本頁就會跟著更新。","sync_ok_stamp":"；線上資料檔最後更新於 {t}","sync_fail":"目前連不上線上字音庫（{err}），顯示的是頁面內建的離線快照（{chars} 字 / {records} 條讀音）。連上網路後按下面的「重新同步」即可取得最新字音。","sec_overview":"音系總覽","sec_rhymes":"分韻總表","sec_units":"各呼位總覽","sec_yuntu":"韻圖","sec_bars":"各呼位字數","sec_notes":"補充說明","st_initials":"聲母","st_finals":"韻母","st_rhymes":"韻（按韻基分）","st_units":"呼位（韻 × 呼）","st_tones":"聲調（{shu} 舒 {ru} 入）","st_cells":"小韻格位","th_no":"調號","th_cls":"調類","th_val":"調值","th_kind":"舒／入","th_class":"類","rt_hu4":"四呼（韻母・音值・小韻數・字數）","kind_shu":"舒聲","kind_ru":"入聲","tone_1":"陰平","tone_2":"陽平","tone_3":"陰上","tone_5":"陰去","tone_6":"陽上去","tone_7":"陰入","tone_8":"陽入","tone_note":"蘇滬混合腔沒有陽上和陽去的分別，這兩類現在的讀音合併成調 6「陽上去」，所以總共只有 {total} 個聲調。","ov1":"<b>分韻以今音的韻基為準。</b>韻基是這個韻的元音加韻尾。韻基不同的，就算是中古同一韻攝，也分成不同的韻；韻基相同的，就算是中古不同韻攝，也歸為同一個韻。依此，<code>i[iᶽ]</code> 和 <code>iu[y]</code> 分成微韻和魚韻，<code>y[ɿ]</code> 和 <code>yu[ʮ]</code> 分成資韻和支韻；入聲的 <code>eq[əʔ]</code>、<code>ueq[uəʔ]</code> 歸質韻，<code>iq[iɪʔ]</code> 歸雪韻，<code>iuq[yɪʔ]</code> 歸月韻。合起來一共 <b>{rhymes} 個韻</b>。","ov2":"<b>開合齊撮逐位列出。</b>一個韻裡面佔了幾個呼，就列出幾個呼位，<b>一個呼位畫一張圖</b>。全部共 <b>{units} 個呼位</b>，其中開口 {n_kai} 位、合口 {n_he} 位、齊齒 {n_qi} 位、撮口 {n_cuo} 位、特例 {n_te} 位。四個呼都齊全的只有「八」韻一個；只佔一個呼位的有十個韻——模（合）、魚（撮）、支（撮）、資（齊）、微（齊）、仙（齊）、侵（齊）、雲（撮）、雪（齊）、月（撮）。","ov3":"<b>韻目代表字都經過核對。</b>每個韻的名字，都取一個本韻裡真的有這個讀音的字，而且由程式逐一驗證過。例如「談」現在讀 <code>de6</code>〔dᴇ〕，屬於灰韻，所以不再拿它來當 －n 韻的韻目；「歌」現在讀 <code>ku1</code>〔kuᵝ〕，屬於模韻；「支」讀 <code>tsyu1</code>〔tsʮ〕，正好用來當撮口擦化韻的韻目；「雪」讀 <code>siq7</code>〔siɪʔ〕是齊齒，「月」讀 <code>yuq8</code>〔yɪʔ〕是撮口，各如其分。總表「韻目取字」那一欄的小字，就是這個韻目字的實際讀音。","ov4":"<b>四呼怎麼判定。</b>有 <code>u</code> 介音或主元音是 <code>u</code> 的算合口，有 <code>i</code> 介音或主元音是 <code>i</code> 的算齊齒，有 <code>yu</code> 介音或主元音是 <code>yu</code>（〔y〕）的算撮口，其餘算開口。<b>擦化元音按它原本的元音來算</b>：〔ɿ〕是〔i〕的擦化，所以整個韻都是齊齒；〔ʮ〕是〔y〕的擦化，所以整個韻都是撮口。","ov5":"<b>舒聲韻和入聲韻分開。</b><b>舒聲韻是聲調 1、2、3、5、6</b>，<b>入聲韻是聲調 7、8</b>。舒聲韻內部不再分平上去，一張圖橫向列出五個舒聲調，這個韻平上去的字都在同一張圖裡；入聲韻單獨列成一區，收喉塞尾 <code>[ʔ]</code>，圖裡只列陰入、陽入兩個調。全圖 {rhymes} 個韻，沒有任何一個韻同時混有舒聲和入聲的字。","ov6":"<b>特例四韻。</b><b>嘸</b><code>m</code>〔m̩〕、<b>唔</b><code>n</code>〔n̩〕、<b>五</b><code>ng</code>〔ŋ̩〕是成音節鼻音，<b>而</b><code>er</code>〔əl〕是捲舌元音；這四個韻<b>不分開合齊撮</b>，各只有一個呼位，所以另外列在入聲韻之後。","ov7":"<b>每一格就是一個小韻，也就是一個合法音節。</b>格子上方是代表字，下方是拼音，滑鼠移到格子上會顯示這個小韻的全部字。蘇滬混合腔的 <b>{syll} 個合法音節全部在圖中</b>，一格一韻，不會重複安放。","ov8":"<b>每個呼位都標了小韻數和字數，兩個數字都能點。</b>點<b>小韻數</b>會打開這個呼位的小韻一覽，再點其中任何一個小韻，就能看到那個小韻的全部轄字；點<b>字數</b>則直接列出這個呼位的全部漢字（按聲調分組）。分韻總表、各呼位總覽和每張韻圖的標題上都有這兩個按鈕。","ov9":"<b>韻圖預設收合。</b>下面的韻圖按韻排列，預設只顯示韻目與統計，點標頭即可展開該韻的圖，再點一下收合；要一次全開可以按上方的「{btn_expand}」。","rt_note":"「韻基」是這個韻的主元音和韻尾；「呼位數」是這個韻佔了四呼中的幾位；「小韻合計」是這個韻實際有的合法音節（含聲調）數量；「字數合計」是這個韻底下所有漢字的去重總數。「類」欄：<b>陰</b>＝陰聲韻，<b>陽</b>＝陽聲韻，<b>入</b>＝入聲韻，<b>特</b>＝特例韻；陰聲韻和陽聲韻都屬於舒聲韻。每一格裡的「<b>N 小韻</b>」和「<b>N 字</b>」按鈕都可以點：點小韻數會列出該呼位的全部小韻（再點其中一個小韻，即可看到它的全部轄字），點字數則直接列出該呼位的全部漢字。","ut_note":"逐條列出每個呼位：韻目、呼、韻母、音值、小韻數與字數。「小韻數」與「字數」都是按鈕，點下去分別看小韻一覽與全部漢字。","cls_yin":"陰","cls_yang":"陽","cls_ru":"入","cls_te":"特","div_shu":"舒聲韻　聲調 1・2・3・5・6　平上去不分開，同一個韻的平上去字都在同一張圖裡","div_ru":"入聲韻　聲調 7・8　收喉塞尾 [ʔ]，單獨列出","div_te":"特例四韻　不分開合齊撮（成音節鼻音 m／n／ng 與捲舌元音 er）","div_shu_short":"舒聲韻","div_ru_short":"入聲韻","div_te_short":"特例四韻（不分四呼）","hu_kai":"開口","hu_he":"合口","hu_qi":"齊齒","hu_cuo":"撮口","hu_te":"特例","hu_suffix":"呼","yt_shu":"舒聲韻","yt_yin":"陰聲韻","yt_yang":"陽聲韻","yt_ru":"入聲韻","yt_te":"特例四韻","yt_shu_note":"舒聲韻指聲調是 1、2、3、5、6 的字，也就是不帶喉塞尾的音節。<b>同一個韻的平、上、去不再分開</b>：下面每一張圖橫向列出五個舒聲調，這個韻平上去的字全部收在同一張圖裡。每張圖標題上的「N 字」都可以點，點開就能看到這個呼位底下的全部漢字。","yt_yin_note":"沒有韻尾（開音節）","yt_yang_note":"鼻音韻尾或鼻化","yt_ru_note":"入聲韻和舒聲韻分開排列，收喉塞尾 <code>[ʔ]</code>，圖裡只列陰入、陽入兩個調。入聲韻同樣有開、合、齊、撮的差別，所以也逐位畫圖。<code>iq</code>〔iɪʔ〕是<b>雪</b>韻（全韻齊齒），<code>iuq</code>〔yɪʔ〕是<b>月</b>韻（全韻撮口）。","yt_te_note":"這四個韻的聲調屬於舒聲（1、2、3、5、6），但元音自成一套，<b>不分開合齊撮</b>，所以另外列成一區：<code>m</code>〔m̩〕、<code>n</code>〔n̩〕、<code>ng</code>〔ŋ̩〕是成音節鼻音，<code>er</code>〔əl〕是捲舌元音。四個韻各只有一個呼位，圖裡仍按五個舒聲調列字。","rh_open":"展開","rh_close":"收合","rh_label":"韻目取字","rh_src":"中古可能的來源（僅供參考）","yt_corner":"聲母＼調","grp_唇音":"唇音","grp_舌音":"舌音","grp_牙音":"牙音","grp_腭音":"腭音","grp_齒音":"齒音","grp_喉音":"喉音","lbl_core":"韻基","lbl_hu":"呼位","lbl_sys":"小韻","lbl_chars":"字數","word_rhyme":"韻","word_sys":"小韻","word_chars":"字","word_char":"字","bars_note":"字數最多的 24 個呼位。","md_back":"‹ 返回小韻一覽","md_close":"關閉（Esc）","md_hint_sys":"下面是「<b>{rhyme}{hu}</b>」（{fin} 〔{ipa}〕）底下的全部小韻，共 <b>{nsys} 個</b>。點任何一列，就能看到那個小韻的全部轄字。","md_tone_head":"{name}<small>調 {no}（{val}）・{nsys} 個小韻 ・共 {nchars} 字</small>","md_rep":"代表字","md_allchars":"全部轄字","md_sys_sub":"{fin} [{ipa}] ・ 共 {nchars} 個字 ・ {nsys} 個小韻（同一個字在本呼位有兩個讀音時會分別列出）","md_direct_sub":"{nchars} 個字 ・ 點「返回小韻一覽」可回上一層","md_n_chars":"{n} 個字","md_allchars_head":"全部轄字<small>共 {nchars} 個字（{nsys} 個小韻）</small>","md_etc":"…等","footer":"蘇滬混合腔韻圖 ・ 分韻 {rhymes} 個，呼位 {units} 個，韻母 {finals} 個 ・ 字音資料同步自 {link}（SiqYin）","n1":"<b>一、舊稿的「談韻」和「歌韻」用錯了韻目。</b>早先拿「談」當 －n 韻的韻目，但「談」現在讀 <code>de6</code>〔dᴇ〕，跟「戴」「帶」「來」「海」是同一個韻（灰韻），名實不符。現在 <code>an／uan／ian</code> 這個韻改用「<b>陽</b>」當韻目：陽讀 <code>yan2</code>〔iã〕，正好在它的齊齒位上。同樣地，「歌」現在讀 <code>ku1</code>〔kuᵝ〕，屬於模韻，所以〔o̝〕這個韻改用「<b>麻</b>」當韻目（麻讀 <code>mo2</code>），〔uᵝ〕這個韻就用「<b>模</b>」當韻目（模讀 <code>mu2</code>）。","n2":"<b>二、「支」「資」各自成韻，「微」「魚」也各自成韻。</b>「支」讀 <code>tsyu1</code>〔tsʮ〕，「資」讀 <code>tsy1</code>〔tsɿ〕：支韻整個是撮口，資韻整個是齊齒。「微」〔iᶽ〕和「魚」〔y〕同樣各自成韻，不相統屬。","n3":"<b>三、入聲六韻。</b>入聲單獨列出，共六個韻：八〔aʔ〕、陌〔ɑʔ〕、質〔əʔ〕、雪〔iɪʔ〕、月〔yɪʔ〕、屋〔oʔ〕。<b><code>iq</code>〔iɪʔ〕是「雪」韻（整個韻都是齊齒），<code>iuq</code>〔yɪʔ〕是「月」韻（整個韻都是撮口）</b>。韻目也很貼切：「雪」讀 <code>siq7</code>〔siɪʔ〕，「月」讀 <code>yuq8</code>〔yɪʔ〕。（<code>iuq</code> 的音值以前誤標成〔yeʔ〕，現在已經改正為〔yɪʔ〕。）","n4":"<b>四、陽韻齊齒位的 iã／iɛ̃ 是文白異讀。</b>陽韻齊齒的 <code>ian</code> 這個位子，字典裡同時記了〔iã〕和〔iɛ̃〕兩種音值，例如「羊」讀〔iã〕、「良」讀〔liɛ̃〕。這是文讀和白讀的差別，兩者仍然是同一個韻、同一個呼位。","n5":"<b>五、特例四韻是怎麼來的。</b>嘸 <code>m</code>〔m̩〕、唔 <code>n</code>〔n̩〕、五 <code>ng</code>〔ŋ̩〕、而 <code>er</code>〔əl〕這四個韻，聲調屬於舒聲，但元音自成一套，沒有介音可言，<b>不分開合齊撮</b>，所以另外歸為「特例」一類，各只有一個呼位，不跟四呼混在一起列。","n6":"<b>六、少數沒有收進圖裡的條目。</b>字典裡的 <code>ba</code>「吧」、<code>kha</code>「快」、<code>don</code>「丼」三條沒有標聲調，另外「如何」「如何然」兩條是多音節詞，都不是單音節的合法音節，所以不立格子；其餘 <b>{syll} 個合法音節全部收進圖裡</b>。","n7":"<b>七、中古來源只是參考。</b>每一韻的「中古可能的來源」那一欄，是為了方便跟傳統韻書對讀而設的。同一個韻常常同時收了幾個不同韻攝的字（例如泰韻兼收麻韻見系，灰韻兼收止攝合口），本圖分韻一律以今音韻基為準，不依中古韻攝。","n8":"<b>八、本頁的字音會跟著線上字音庫更新。</b>本頁開啟時會即時讀取「蘇滬混合腔字音查詢」的資料檔（<code>data/DB_suhu.json</code>），在瀏覽器裡重新分韻排圖。所以字音查詢那邊新增字或是補上讀音之後，重新整理本頁就會看到最新的字。如果連不上網路，頁面會改用內建的離線快照（<b>{chars}</b> 字），並在上方顯示提示；連上網路後按「重新同步線上字音庫」即可。","n9":"<b>九、字型。</b>本頁預設使用<b>霞鶩文楷</b>（LXGW WenKai）顯示，因為字典收了大量生僻字，一般系統字型顯示不出來。字型已子集化後隨頁面一起提供，分「核心字集」與「完整字集」兩級，正常只會下載前者（約 2 MB）。","lang_label":"語言","lang_wu":"漢語","lang_en":"English","lang_ja":"日本語"},"en":{"page_title":"Su–Hu Mixed Wu Rhyme Chart","h1":"Su–Hu Mixed Wu Rhyme Chart","tagline":"Rhymes divided by modern rhyme base · the four divisions listed slot by slot · one chart per slot","based_on":"Compiled from SiqYin's {dict} and the {rime}. This page contains <b>{chars}</b> characters, <b>{records}</b> readings, and <b>{syll}</b> valid syllables (tones included).","link_dict":"Su–Hu Mixed Wu online dictionary","link_rime":"Rime input scheme","btn_sync":"Re-sync the online reading database","btn_expand":"Expand all rhyme charts","btn_collapse":"Collapse all rhyme charts","btn_top":"Back to top","btn_hide":"Hide all-empty initial rows","btn_show":"Show all-empty initial rows","sync_loading":"Loading the online reading database…","sync_ok":"Synced with the online reading database ({link}): <b>{chars}</b> characters, <b>{records}</b> readings, <b>{syll}</b> valid syllables{stamp}. Whenever the lookup site is updated, reloading this page brings the changes in.","sync_ok_stamp":"; the online file was last updated on {t}","sync_fail":"The online reading database cannot be reached ({err}), so the built-in offline snapshot is being shown ({chars} characters / {records} readings). Press “Re-sync” once you are back online.","sec_overview":"Phonology at a glance","sec_rhymes":"Rhyme index","sec_units":"All division slots","sec_yuntu":"Rhyme charts","sec_bars":"Characters per division slot","sec_notes":"Notes","st_initials":"initials","st_finals":"finals","st_rhymes":"rhymes (by base)","st_units":"division slots","st_tones":"tones ({shu} unchecked · {ru} checked)","st_cells":"homophone groups","th_no":"Tone","th_cls":"Register","th_val":"Value","th_kind":"Type","th_class":"Class","rt_hu4":"Four divisions (final · IPA · groups · chars)","kind_shu":"Unchecked","kind_ru":"Checked","tone_1":"Yin Ping","tone_2":"Yang Ping","tone_3":"Yin Shang","tone_5":"Yin Qu","tone_6":"Yang Shang–Qu","tone_7":"Yin Ru","tone_8":"Yang Ru","tone_note":"Su–Hu Mixed Wu does not distinguish Yang Shang from Yang Qu; the two have merged into tone 6, “Yang Shang–Qu”. That leaves {total} tones in all.","ov1":"<b>Rhymes follow the modern rhyme base.</b> The base is the rhyme's vowel plus its coda. A different base means a different rhyme even if the characters belonged to the same Middle Chinese group; the same base means one rhyme even if they came from different groups. Thus <code>i[iᶽ]</code> and <code>iu[y]</code> split into 微 and 魚, and <code>y[ɿ]</code> and <code>yu[ʮ]</code> into 資 and 支; among the checked rhymes, <code>eq[əʔ]</code> and <code>ueq[uəʔ]</code> go to 質, <code>iq[iɪʔ]</code> to 雪, and <code>iuq[yɪʔ]</code> to 月. In total there are <b>{rhymes} rhymes</b>.","ov2":"<b>Open, closed, spread and rounded are listed slot by slot.</b> However many divisions a rhyme occupies, that many slots are listed, <b>one chart per slot</b>. All told there are <b>{units} slots</b>: open {n_kai}, closed {n_he}, spread {n_qi}, rounded {n_cuo}, special {n_te}. Only the 八 rhyme fills all four; ten rhymes have just one slot — 模 (closed), 魚 (rounded), 支 (rounded), 資 (spread), 微 (spread), 仙 (spread), 侵 (spread), 雲 (rounded), 雪 (spread), 月 (rounded).","ov3":"<b>Every rhyme name has been checked.</b> Each rhyme takes its name from a character that genuinely has that reading in the rhyme, verified one by one by the build script. 談, for instance, is now read <code>de6</code> [dᴇ] and belongs to the 灰 rhyme, so it is no longer used as the label of the −n rhyme; 歌 is now <code>ku1</code> [kuᵝ] and belongs to 模; 支 is <code>tsyu1</code> [tsʮ], a perfect label for the rounded fricated rhyme; 雪 is <code>siq7</code> [siɪʔ] (spread) and 月 is <code>yuq8</code> [yɪʔ] (rounded). The small text under “Rhyme label” in the index is that character's actual reading.","ov4":"<b>How the four divisions are decided.</b> A <code>u</code> medial or a main vowel <code>u</code> counts as closed; <code>i</code> as spread; <code>yu</code> ([y]) as rounded; everything else is open. <b>Fricated vowels count as the vowel they come from</b>: [ɿ] is the fricated form of [i], so that whole rhyme is spread; [ʮ] is the fricated form of [y], so that whole rhyme is rounded.","ov5":"<b>Unchecked and checked rhymes are kept apart.</b> <b>Unchecked rhymes are tones 1, 2, 3, 5 and 6</b>; <b>checked rhymes are tones 7 and 8</b>. Within an unchecked rhyme the level, rising and departing tones are no longer separated: one chart across the page lists the five unchecked tones and holds every level, rising and departing character of that rhyme. Checked rhymes form a separate block with the glottal-stop coda <code>[ʔ]</code>, listing only Yin Ru and Yang Ru. Across all {rhymes} rhymes, no rhyme mixes unchecked and checked characters.","ov6":"<b>The four special rhymes.</b> 嘸 <code>m</code> [m̩], 唔 <code>n</code> [n̩] and 五 <code>ng</code> [ŋ̩] are syllabic nasals, and 而 <code>er</code> [əl] is a retroflex vowel. These four <b>take no part in the four divisions</b> and have a single slot each, so they are listed after the checked rhymes.","ov7":"<b>Each cell is one homophone group, that is, one legal syllable.</b> The representative character sits above and the romanization below; hovering over a cell shows every character in that group. All <b>{syll} legal syllables</b> of Su–Hu Mixed Wu are in the charts, one syllable to a cell, never placed twice.","ov8":"<b>Every division slot is labelled with a group count and a character count, and both numbers are clickable.</b> Clicking the <b>group count</b> opens the list of homophone groups in that slot; clicking any group then shows all of its characters. Clicking the <b>character count</b> lists every character in the slot at once, grouped by tone. Both buttons appear in the rhyme index, the slot index and every chart heading.","ov9":"<b>The rhyme charts start collapsed.</b> The charts below are arranged by rhyme and show only the label and its statistics by default; click a header to open that rhyme's charts, click again to close it. To open them all at once, press “{btn_expand}” above.","rt_note":"“Base” is the rhyme's main vowel and coda; “slots” is how many of the four divisions the rhyme occupies; “groups” is the number of legal syllables (tones included) the rhyme actually has; “characters” is the deduplicated total of all characters under it. The “Class” column: <b>陰</b> unchecked with a vowel ending, <b>陽</b> unchecked with a nasal ending, <b>入</b> checked, <b>特</b> special. Both 陰 and 陽 belong to the unchecked rhymes. The “<b>N groups</b>” and “<b>N chars</b>” buttons in each cell are clickable: the group count lists the slot's groups (click one to see all its characters), and the character count lists every character in the slot outright.","ut_note":"Every division slot listed one by one: rhyme, division, final, phonetic value, group count and character count. Both numbers are buttons — click to see the group list or all the characters.","cls_yin":"陰","cls_yang":"陽","cls_ru":"入","cls_te":"特","div_shu":"Unchecked rhymes · tones 1・2・3・5・6 · level, rising and departing are not separated; all of a rhyme's characters sit in one chart","div_ru":"Checked rhymes · tones 7・8 · with the glottal-stop coda [ʔ], listed separately","div_te":"The four special rhymes · no four-division split (syllabic nasals m／n／ng and the retroflex vowel er)","div_shu_short":"Unchecked rhymes","div_ru_short":"Checked rhymes","div_te_short":"Special rhymes (no four divisions)","hu_kai":"Open","hu_he":"Closed","hu_qi":"Spread","hu_cuo":"Rounded","hu_te":"Special","hu_suffix":"","yt_shu":"Unchecked rhymes","yt_yin":"Vowel-ending rhymes","yt_yang":"Nasal-ending rhymes","yt_ru":"Checked rhymes","yt_te":"The four special rhymes","yt_shu_note":"Unchecked rhymes are the ones with tones 1, 2, 3, 5 and 6 — syllables without a glottal-stop coda. <b>Level, rising and departing are no longer separated within a rhyme</b>: each chart below runs across the five unchecked tones and holds every character of that rhyme. The “N chars” on each chart heading is clickable and shows all the characters in that slot.","yt_yin_note":"no coda (open syllables)","yt_yang_note":"nasal coda or nasalised","yt_ru_note":"Checked rhymes are kept apart from unchecked ones. They take the glottal-stop coda <code>[ʔ]</code> and their charts list only Yin Ru and Yang Ru. They show the same open／closed／spread／rounded distinctions, so they are charted slot by slot too. <code>iq</code> [iɪʔ] is the 雪 rhyme (spread throughout) and <code>iuq</code> [yɪʔ] the 月 rhyme (rounded throughout).","yt_te_note":"These four rhymes have unchecked tones (1, 2, 3, 5, 6), but their vowels stand apart and they have no medial, so they <b>take no part in the four divisions</b> and are listed as a separate block: <code>m</code> [m̩], <code>n</code> [n̩] and <code>ng</code> [ŋ̩] are syllabic nasals, <code>er</code> [əl] a retroflex vowel. Each has a single slot and still lists characters under the five unchecked tones.","rh_open":"Open","rh_close":"Close","rh_label":"Label read as","rh_src":"Probable Middle Chinese sources (for reference only)","yt_corner":"Initial ＼ Tone","grp_唇音":"Labials","grp_舌音":"Dentals & Alveolars","grp_牙音":"Velars","grp_腭音":"Palatals","grp_齒音":"Sibilants","grp_喉音":"Gutturals","lbl_core":"Base","lbl_hu":"slots","lbl_sys":"groups","lbl_chars":"chars","word_rhyme":" rhyme","word_sys":"groups","word_chars":"chars","word_char":"chars","bars_note":"The 24 division slots with the most characters.","md_back":"‹ Back to the group list","md_close":"Close (Esc)","md_hint_sys":"Below are all the homophone groups under <b>{rhyme}{hu}</b> ({fin} [{ipa}]) — <b>{nsys}</b> in total. Click any row to see every character in that group.","md_tone_head":"{name}<small>tone {no} ({val}) · {nsys} groups · {nchars} chars</small>","md_rep":"Representative","md_allchars":"All characters","md_sys_sub":"{fin} [{ipa}] · {nchars} characters · {nsys} groups (a character with two readings in this slot is listed once for each)","md_direct_sub":"{nchars} characters · press “Back to the group list” to go up one level","md_n_chars":"{n} chars","md_allchars_head":"All characters<small>{nchars} characters in all ({nsys} groups)</small>","md_etc":" … etc.","footer":"Su–Hu Mixed Wu Rhyme Chart · {rhymes} rhymes, {units} division slots, {finals} finals · readings synced from {link} (SiqYin)","n1":"<b>1. The old labels 談 and 歌 were wrong.</b> 談 was once used as the label of the −n rhyme, but 談 is now read <code>de6</code> [dᴇ] and belongs with 戴, 帶, 來 and 海 in the 灰 rhyme, so the name did not fit. The <code>an／uan／ian</code> rhyme now takes <b>陽</b> as its label: 陽 is <code>yan2</code> [iã], right in its spread slot. Likewise 歌 is now <code>ku1</code> [kuᵝ] and belongs to 模, so the [o̝] rhyme takes <b>麻</b> as its label (麻 is <code>mo2</code>) and the [uᵝ] rhyme takes <b>模</b> (模 is <code>mu2</code>).","n2":"<b>2. 支 and 資 form separate rhymes; so do 微 and 魚.</b> 支 is <code>tsyu1</code> [tsʮ] and 資 is <code>tsy1</code> [tsɿ]: the 支 rhyme is rounded throughout, the 資 rhyme spread throughout. 微 [iᶽ] and 魚 [y] likewise form rhymes of their own that do not subsume one another.","n3":"<b>3. The six checked rhymes.</b> Six checked rhymes are listed separately: 八 [aʔ], 陌 [ɑʔ], 質 [əʔ], 雪 [iɪʔ], 月 [yɪʔ], 屋 [oʔ]. <b><code>iq</code> [iɪʔ] is the 雪 rhyme (spread throughout), and <code>iuq</code> [yɪʔ] the 月 rhyme (rounded throughout).</b> The labels fit too: 雪 is <code>siq7</code> [siɪʔ], 月 is <code>yuq8</code> [yɪʔ]. (The value of <code>iuq</code> was once mis-written [yeʔ]; it has been corrected to [yɪʔ].)","n4":"<b>4. iã／iɛ̃ in the 陽 rhyme's spread slot are literary versus colloquial readings.</b> For <code>ian</code> in the 陽 rhyme the dictionary records both [iã] and [iɛ̃] — for example 羊 [iã] and 良 [liɛ̃]. That is a literary/colloquial difference; both readings remain one rhyme and one slot.","n5":"<b>5. Where the four special rhymes come from.</b> 嘸 <code>m</code> [m̩], 唔 <code>n</code> [n̩], 五 <code>ng</code> [ŋ̩] and 而 <code>er</code> [əl] have unchecked tones, but their vowels form a set of their own with no medial, so they <b>take no part in the four divisions</b> and are classed as “special”, each with a single slot, listed apart from the four divisions.","n6":"<b>6. The few entries left out.</b> In the dictionary, <code>ba</code> 吧, <code>kha</code> 快 and <code>don</code> 丼 carry no tone mark, and 如何 and 如何然 are polysyllabic words; none of them is a single-syllable legal syllable, so no cell is made for them. The remaining <b>{syll} legal syllables are all in the charts</b>.","n7":"<b>7. Middle Chinese sources are only a reference.</b> The “probable Middle Chinese sources” line exists to make comparison with the traditional rhyme books easier. A single rhyme often gathers characters from several Middle Chinese groups (the 泰 rhyme also takes the 麻 rhyme's velar series, for instance, and 灰 also takes the 止 group's closed readings). The division here always follows the modern rhyme base, never the Middle Chinese groups.","n8":"<b>8. The readings follow the online database.</b> On loading, the page fetches the data file of “Su–Hu Mixed Wu Character Lookup” (<code>data/DB_suhu.json</code>) and re-divides the rhymes and re-lays the charts in the browser. So after characters or readings are added on the lookup site, reloading this page shows them. If the network is unavailable the page falls back to its built-in offline snapshot (<b>{chars}</b> characters) and says so at the top; press “Re-sync the online reading database” once you are back online.","n9":"<b>9. Typeface.</b> The page uses <b>LXGW WenKai</b> by default, because the dictionary contains a great many rare characters that ordinary system fonts cannot show. The font is shipped with the site as a subset in two tiers — a core set and a full set — and normally only the former (about 2 MB) is downloaded.","lang_label":"Language","lang_wu":"漢語","lang_en":"English","lang_ja":"日本語"},"ja":{"page_title":"蘇滬混合腔韻図","h1":"蘇滬混合腔韻図","tagline":"現代音の韻基で分韻し、開・合・斉・撮を一位ずつ掲げ、一位に一図","based_on":"SiqYin の{dict}（字音検索）と{rime}により作成。本頁の収録字数 <b>{chars}</b>、読み <b>{records}</b> 件、合法音節（声調込み）<b>{syll}</b>。","link_dict":"蘇滬混合腔オンライン字典","link_rime":"RIME 輸入方案","btn_sync":"オンライン字音庫を再同期","btn_expand":"韻図をすべて展開","btn_collapse":"韻図をすべて畳む","btn_top":"ページ先頭へ","btn_hide":"空の声母行を隠す","btn_show":"空の声母行を表示","sync_loading":"オンライン字音庫を読み込んでいます……","sync_ok":"オンライン字音庫と同期しました（{link}）：収録字数 <b>{chars}</b>、読み <b>{records}</b> 件、合法音節 <b>{syll}</b> 個{stamp}。検索サイト側で更新があれば、この頁を再読み込みすれば反映されます。","sync_ok_stamp":"；オンラインデータの最終更新は {t}","sync_fail":"オンライン字音庫に接続できません（{err}）。表示しているのは頁に内蔵されたオフラインスナップショット（{chars} 字／{records} 件の読み）です。接続できたら下の「再同期」を押してください。","sec_overview":"音系概観","sec_rhymes":"分韻一覧","sec_units":"呼位一覧","sec_yuntu":"韻図","sec_bars":"呼位ごとの字数","sec_notes":"補足説明","st_initials":"声母","st_finals":"韻母","st_rhymes":"韻（韻基による）","st_units":"呼位（韻×呼）","st_tones":"声調（舒 {shu}・入 {ru}）","st_cells":"小韻の枠","th_no":"調号","th_cls":"調類","th_val":"調値","th_kind":"舒／入","th_class":"類","rt_hu4":"四呼（韻母・音価・小韻数・字数）","kind_shu":"舒声","kind_ru":"入声","tone_1":"陰平","tone_2":"陽平","tone_3":"陰上","tone_5":"陰去","tone_6":"陽上去","tone_7":"陰入","tone_8":"陽入","tone_note":"蘇滬混合腔には陽上と陽去の区別がなく、この二類は現在どちらも調 6「陽上去」に統合されている。したがって声調は全部で {total} つである。","ov1":"<b>分韻は現代音の韻基による。</b>韻基とはその韻の母音と韻尾である。韻基が違えば、中古に同じ韻摂に属していても別の韻に分ける。韻基が同じなら、中古に別の韻摂から来ていても同じ韻にまとめる。したがって <code>i[iᶽ]</code> と <code>iu[y]</code> は微韻と魚韻に、<code>y[ɿ]</code> と <code>yu[ʮ]</code> は資韻と支韻に分かれる。入声では <code>eq[əʔ]</code>・<code>ueq[uəʔ]</code> が質韻に、<code>iq[iɪʔ]</code> が雪韻に、<code>iuq[yɪʔ]</code> が月韻になる。合わせて <b>{rhymes} 韻</b>。","ov2":"<b>開・合・斉・撮を一位ずつ掲げる。</b>一つの韻がいくつの呼を占めるかによって、その数の呼位を掲げ、<b>一位に一図</b>を描く。全部で <b>{units} の呼位</b>、うち開口 {n_kai}、合口 {n_he}、斉歯 {n_qi}、撮口 {n_cuo}、特例 {n_te}。四呼がそろうのは「八」韻ただ一つ。呼位が一つだけなのは十韻——模（合）・魚（撮）・支（撮）・資（斉）・微（斉）・仙（斉）・侵（斉）・雲（撮）・雪（斉）・月（撮）。","ov3":"<b>韻目の代表字はすべて検証済みである。</b>各韻の名には、その韻に本当にその読みがある字を取り、しかもプログラムで一字ずつ確かめてある。たとえば「談」は現在 <code>de6</code>〔dᴇ〕で灰韻に属するため、もはや −n 韻の韻目にはしない。「歌」は現在 <code>ku1</code>〔kuᵝ〕で模韻に属する。「支」は <code>tsyu1</code>〔tsʮ〕で、撮口の摩擦化韻の韻目にうってつけである。「雪」は <code>siq7</code>〔siɪʔ〕で斉歯、「月」は <code>yuq8</code>〔yɪʔ〕で撮口、それぞれ名実が一致する。一覧の「韻目取字」欄の小さい文字が、その韻目字の実際の読みである。","ov4":"<b>四呼の判定。</b><code>u</code> の介音をもつもの、または主母音が <code>u</code> のものは合口。<code>i</code> の介音、または主母音が <code>i</code> のものは斉歯。<code>yu</code> の介音、または主母音が <code>yu</code>（〔y〕）のものは撮口。残りは開口とする。<b>摩擦化した母音は元の母音で数える</b>：〔ɿ〕は〔i〕の摩擦化なのでその韻全体が斉歯、〔ʮ〕は〔y〕の摩擦化なのでその韻全体が撮口である。","ov5":"<b>舒声韻と入声韻は分けて並べる。</b><b>舒声韻は声調 1・2・3・5・6</b>、<b>入声韻は声調 7・8</b>。舒声韻の内部では平・上・去をさらに分けない。一つの図に五つの舒声調を横に並べ、その韻の平・上・去の字はすべて同じ図に入る。入声韻は別の区として掲げ、喉塞尾 <code>[ʔ]</code> をもち、図には陰入と陽入の二調だけを並べる。全体で {rhymes} 韻、舒声と入声の字が混じる韻は一つもない。","ov6":"<b>特例の四韻。</b><b>嘸</b><code>m</code>〔m̩〕・<b>唔</b><code>n</code>〔n̩〕・<b>五</b><code>ng</code>〔ŋ̩〕は成節鼻音、<b>而</b><code>er</code>〔əl〕は反舌母音である。この四韻は<b>開合斉撮に分かれず</b>、それぞれ呼位を一つだけもつので、入声韻の後に別に掲げる。","ov7":"<b>一つの枠が一つの小韻、すなわち一つの合法音節である。</b>枠の上に代表字、下にローマ字を示し、枠にマウスを乗せるとその小韻のすべての字が表示される。蘇滬混合腔の <b>{syll} の合法音節はすべて図の中にあり</b>、一枠に一韻、重複して置かれることはない。","ov8":"<b>どの呼位にも小韻数と字数が付いており、どちらの数字も押せる。</b><b>小韻数</b>を押すとその呼位の小韻一覧が開き、その中のどれかを押せばその小韻のすべての所属字が見られる。<b>字数</b>を押すとその呼位の全漢字が声調ごとに並ぶ。分韻一覧・呼位一覧・各韻図の見出しのいずれにもこの二つのボタンがある。","ov9":"<b>韻図は既定で畳んである。</b>下の韻図は韻ごとに並べ、既定では韻目と統計だけを表示する。見出しを押せばその韻の図が開き、もう一度押せば畳まれる。全部を一度に開くには上の「{btn_expand}」を押す。","rt_note":"「韻基」はその韻の主母音と韻尾。「呼位数」はその韻が四呼のうちいくつを占めるか。「小韻合計」はその韻が実際にもつ合法音節（声調込み）の数。「字数合計」はその韻に属する全漢字の重複を除いた総数。「類」欄：<b>陰</b>＝陰声韻、<b>陽</b>＝陽声韻、<b>入</b>＝入声韻、<b>特</b>＝特例韻。陰声韻と陽声韻はいずれも舒声韻に属する。各枠の「<b>N 小韻</b>」と「<b>N 字</b>」のボタンはどちらも押せる。小韻数を押すとその呼位の小韻が並び（そのうち一つを押せばその小韻の全所属字が見られる）、字数を押すとその呼位の全漢字がそのまま並ぶ。","ut_note":"各呼位を一条ずつ掲げる：韻目・呼・韻母・音価・小韻数・字数。「小韻数」と「字数」はどちらもボタンで、押すとそれぞれ小韻一覧と全漢字が見られる。","cls_yin":"陰","cls_yang":"陽","cls_ru":"入","cls_te":"特","div_shu":"舒声韻　声調 1・2・3・5・6　平・上・去を分けず、同じ韻の平上去の字は同じ図にある","div_ru":"入声韻　声調 7・8　喉塞尾 [ʔ] をもち、別に掲げる","div_te":"特例の四韻　開合斉撮に分かれない（成節鼻音 m／n／ng と反舌母音 er）","div_shu_short":"舒声韻","div_ru_short":"入声韻","div_te_short":"特例の四韻（四呼に分かれず）","hu_kai":"開口","hu_he":"合口","hu_qi":"斉歯","hu_cuo":"撮口","hu_te":"特例","hu_suffix":"呼","yt_shu":"舒声韻","yt_yin":"陰声韻","yt_yang":"陽声韻","yt_ru":"入声韻","yt_te":"特例の四韻","yt_shu_note":"舒声韻とは声調が 1・2・3・5・6 の字、つまり喉塞尾をもたない音節である。<b>同じ韻の平・上・去はもはや分けない</b>：下の各図は五つの舒声調を横に並べ、その韻の平上去の字をすべて同じ図に収める。各図の見出しにある「N 字」は押すことができ、その呼位に属する全漢字が表示される。","yt_yin_note":"韻尾なし（開音節）","yt_yang_note":"鼻音韻尾または鼻母音化","yt_ru_note":"入声韻は舒声韻と分けて並べる。喉塞尾 <code>[ʔ]</code> をもち、図には陰入と陽入の二調だけを並べる。入声韻にも開・合・斉・撮の区別があるので、同じく一位ずつ図を描く。<code>iq</code>〔iɪʔ〕は<b>雪</b>韻（韻全体が斉歯）、<code>iuq</code>〔yɪʔ〕は<b>月</b>韻（韻全体が撮口）である。","yt_te_note":"この四韻の声調は舒声（1・2・3・5・6）に属するが、母音が独自の体系をなし、介音もないため<b>開合斉撮に分かれず</b>、別の区として掲げる：<code>m</code>〔m̩〕・<code>n</code>〔n̩〕・<code>ng</code>〔ŋ̩〕は成節鼻音、<code>er</code>〔əl〕は反舌母音である。四韻はいずれも呼位を一つだけもち、図には依然として五つの舒声調で字を並べる。","rh_open":"展開","rh_close":"畳む","rh_label":"韻目取字","rh_src":"中古の推定来源（参考のみ）","yt_corner":"声母＼調","grp_唇音":"唇音","grp_舌音":"舌音","grp_牙音":"牙音","grp_腭音":"硬口蓋音","grp_齒音":"歯音","grp_喉音":"喉音","lbl_core":"韻基","lbl_hu":"呼位","lbl_sys":"小韻","lbl_chars":"字数","word_rhyme":"韻","word_sys":"小韻","word_chars":"字","word_char":"字","bars_note":"字数の多い順に 24 の呼位。","md_back":"‹ 小韻一覧に戻る","md_close":"閉じる（Esc）","md_hint_sys":"以下は「<b>{rhyme}{hu}</b>」（{fin}〔{ipa}〕）に属する小韻のすべて、全部で <b>{nsys} 個</b>。どの行を押しても、その小韻の全所属字が見られる。","md_tone_head":"{name}<small>調 {no}（{val}）・小韻 {nsys} 個 ・計 {nchars} 字</small>","md_rep":"代表字","md_allchars":"全所属字","md_sys_sub":"{fin} [{ipa}] ・ 計 {nchars} 字 ・ {nsys} 個の小韻（同じ字がこの呼位に二つの読みをもつ場合は別々に掲げる）","md_direct_sub":"{nchars} 字 ・「小韻一覧に戻る」で一つ上の階層へ","md_n_chars":"{n} 字","md_allchars_head":"全所属字<small>計 {nchars} 字（{nsys} 個の小韻）</small>","md_etc":"…ほか","footer":"蘇滬混合腔韻図 ・ 分韻 {rhymes}、呼位 {units}、韻母 {finals} ・ 字音データは {link}（SiqYin）より同期","n1":"<b>一、旧稿の「談韻」「歌韻」は韻目を誤っていた。</b>以前は「談」を −n 韻の韻目にしていたが、「談」は現在 <code>de6</code>〔dᴇ〕で「戴」「帶」「來」「海」と同じ韻（灰韻）に属し、名実が伴わない。そこで <code>an／uan／ian</code> の韻は「<b>陽</b>」を韻目とした：陽は <code>yan2</code>〔iã〕で、ちょうどその斉歯の位にある。同様に「歌」は現在 <code>ku1</code>〔kuᵝ〕で模韻に属するため、〔o̝〕の韻は「<b>麻</b>」を韻目とし（麻は <code>mo2</code>）、〔uᵝ〕の韻は「<b>模</b>」を韻目とする（模は <code>mu2</code>）。","n2":"<b>二、「支」「資」はそれぞれ独立した韻、「微」「魚」もそれぞれ独立した韻である。</b>「支」は <code>tsyu1</code>〔tsʮ〕、「資」は <code>tsy1</code>〔tsɿ〕で、支韻は全体が撮口、資韻は全体が斉歯である。同様に「微」〔iᶽ〕と「魚」〔y〕もそれぞれ独立した韻で、互いに包括関係にはない。","n3":"<b>三、入声の六韻。</b>入声は別に掲げ、全部で六韻：八〔aʔ〕・陌〔ɑʔ〕・質〔əʔ〕・雪〔iɪʔ〕・月〔yɪʔ〕・屋〔oʔ〕。<b><code>iq</code>〔iɪʔ〕は「雪」韻（韻全体が斉歯）、<code>iuq</code>〔yɪʔ〕は「月」韻（韻全体が撮口）である。</b>韻目もよく合う：「雪」は <code>siq7</code>〔siɪʔ〕、「月」は <code>yuq8</code>〔yɪʔ〕。（<code>iuq</code> の音価は以前〔yeʔ〕と誤記していたが、現在は〔yɪʔ〕に訂正済み。）","n4":"<b>四、陽韻斉歯位の iã／iɛ̃ は文白異読である。</b>陽韻斉歯の <code>ian</code> の位には、字典が〔iã〕と〔iɛ̃〕の二つの音価を併記している。たとえば「羊」は〔iã〕、「良」は〔liɛ̃〕。これは文読と白読の違いであり、両者は依然として同じ韻・同じ呼位である。","n5":"<b>五、特例の四韻の由来。</b>嘸 <code>m</code>〔m̩〕・唔 <code>n</code>〔n̩〕・五 <code>ng</code>〔ŋ̩〕・而 <code>er</code>〔əl〕の四韻は、声調は舒声に属するが、母音が独自の体系をなし、介音もないため<b>開合斉撮に分かれず</b>、「特例」という別の類にまとめた。それぞれ呼位は一つだけで、四呼とは混ぜて並べない。","n6":"<b>六、図に収めなかった少数の項目。</b>字典の <code>ba</code>「吧」・<code>kha</code>「快」・<code>don</code>「丼」の三条は声調の記載がなく、また「如何」「如何然」の二条は多音節語で、いずれも単音節の合法音節ではないため枠を設けない。残る <b>{syll} の合法音節はすべて図に収めてある</b>。","n7":"<b>七、中古の来源は参考にすぎない。</b>各韻の「中古の推定来源」の欄は、伝統的な韻書と対照しやすくするために設けたものである。一つの韻はしばしば複数の韻摂の字を併せて収める（たとえば泰韻は麻韻の見系を兼ね、灰韻は止摂の合口を兼ねる）。本図の分韻はあくまで現代音の韻基を基準とし、中古の韻摂にはよらない。","n8":"<b>八、本頁の字音はオンライン字音庫に追随する。</b>本頁は開いたときに「蘇滬混合腔字音検索」のデータファイル（<code>data/DB_suhu.json</code>）を即時に読み込み、ブラウザ内で分韻し直し、図を組み直す。したがって検索サイト側で字を追加したり読みを補ったりすれば、この頁を再読み込みするだけで最新の字が見られる。ネットワークに接続できない場合は、頁に内蔵されたオフラインスナップショット（<b>{chars}</b> 字）に切り替わり、上部にその旨を表示する。接続後は「オンライン字音庫を再同期」を押せばよい。","n9":"<b>九、書体。</b>本頁は既定で<b>霞鶩文楷</b>（LXGW WenKai）で表示する。字典が多数の生僻字を収めており、一般的なシステム書体では表示できないためである。書体はサブセット化して頁と一緒に配信し、「核心字集」と「完全字集」の二段構えとしている。通常は前者（約 2 MB）のみをダウンロードする。","lang_label":"言語","lang_wu":"漢語","lang_en":"English","lang_ja":"日本語"}}</script>
<script id="gloss" type="application/json">{"en":["Xie group: 泰 佳 皆 夬 (open & closed) + Jia group: 麻 rhyme, velar series (spread) + Guo group: 歌 rhyme, colloquial readings","Jia group: 麻 rhyme, plain-grade readings; also takes Guo group 戈 rhyme","Xie group: 咍 泰, grade I + Zhi group: closed readings, colloquial","Xiao group: 豪 肴 宵 蕭","Liu group: 侯 尤 幽","Shan group: 寒 桓 + Xian group: 覃 談 + Zhi group: closed readings","Yu group: 模 魚 虞, plain-grade readings + Guo group: 歌 戈","Yu group: 魚 虞, fine-grade readings","Zhi group: 支 脂 之, 知 照 日 series, fricated + Yu group: 魚 虞, 知 照 series","Zhi group: 支 脂 之, 精 series, fricated","Zhi group: 支 脂 之 微, open readings + Xie group: 齊 祭","Xian group: 鹽 嚴 添 + Shan group: 仙 元 先, grades III–IV (nasal coda lost)","Geng group: 庚 耕, colloquial + Dang group: 陽 唐, colloquial","Dang group: 唐 陽 + Jiang group: 江","Zhen group: 痕 魂 + 真 諄, 知 照 series + Zeng & Geng groups, grades I–II","Shen group: 侵 + Zhen group: 真 + Zeng & Geng groups, grades III–IV","Zhen group: 諄 文, closed readings, grade III, velar series","Tong group: 東 冬 鍾","Shan group: 曷 黠 鎋 薛 + Xian group: 合 盍 洽 狎 葉 帖","Geng group: 陌 麥 + Dang group: 藥 鐸, grades II–III","Zhen group: 質 術 物 + Zeng group: 德 職 + Geng group: 陌 麥, literary + Shen group: 緝","Shan group: 屑 薛, fine-grade + Geng group: 錫 + Shen group: 緝, fine-grade (spread)","Shan group: 月 屑 薛, fine-grade + Zhen group: 物 迄 + Geng group: 錫 (rounded)","Tong group: 屋 沃 燭 + Dang group: 鐸","Ming initial, colloquial reading; syllabic labial nasal","Ni initial, colloquial reading; syllabic apical nasal","Yi initial, colloquial reading; syllabic velar nasal","Zhi group: 日 initial, 「兒 爾 二」 and the like; now a retroflex vowel"],"ja":["蟹摂 泰・佳・皆・夬（開合）＋仮摂 麻韻見系（斉歯）＋果摂 歌韻白読","仮摂 麻韻の洪音；果摂 戈韻も兼収","蟹摂 咍・泰の一等＋止摂の合口白読","効摂 豪・肴・宵・蕭","流摂 侯・尤・幽","山摂 寒・桓＋咸摂 覃・談＋止摂の合口","遇摂 模・魚・虞の洪音＋果摂 歌・戈","遇摂 魚・虞の細音","止摂 支・脂・之の知・照・日組（摩擦化）＋遇摂 魚・虞の知・照組","止摂 支・脂・之の精組（摩擦化）","止摂 支・脂・之・微の開口＋蟹摂 斉・祭","咸摂 塩・厳・添＋山摂 仙・元・先の三四等（鼻音韻尾の脱落）","梗摂 庚・耕の白読＋宕摂 陽・唐の白読","宕摂 唐・陽＋江摂 江","臻摂 痕・魂＋真・諄の知照組＋曾・梗摂の一二等","深摂 侵＋臻摂 真＋曾・梗摂の三四等","臻摂 諄・文の合口三等見系","通摂 東・冬・鍾","山摂 曷・黠・鎋・薛＋咸摂 合・盍・洽・狎・葉・帖","梗摂 陌・麦＋宕摂 薬・鐸の二三等","臻摂 質・術・物＋曾摂 徳・職＋梗摂 陌・麦の文読＋深摂 緝","山摂 屑・薛の細音＋梗摂 錫＋深摂 緝の細音（斉歯）","山摂 月・屑・薛の細音＋臻摂 物・迄＋梗摂 錫（撮口）","通摂 屋・沃・燭＋宕摂 鐸","明母の白読。成節唇鼻音","泥母の白読。成節舌尖鼻音","疑母の白読。成節舌根鼻音","止摂 日母「兒・爾・二」など；現在は反舌母音"]}</script>
<script>
var SCHEME = JSON.parse(document.getElementById('scheme').textContent);
var SNAP   = JSON.parse(document.getElementById('snapshot').textContent);
var I18N   = JSON.parse(document.getElementById('i18n').textContent);
var GLOSS  = JSON.parse(document.getElementById('gloss').textContent);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- 三語 ---------- */
var LANG = 'wu';
function t(k){
  var d = I18N[LANG] || {};
  return (d[k] !== undefined) ? d[k] : (I18N.wu[k] !== undefined ? I18N.wu[k] : k);
}
function n(k, o){
  return t(k).replace(/\{(\w+)\}/g, function(m, x){
    return (o && o[x] !== undefined) ? o[x] : m;
  });
}
var LANG_LABEL = {wu:'lang_wu', en:'lang_en', ja:'lang_ja'};
function langLabel(l){ return t(LANG_LABEL[l]); }

/* 霞鶩文楷缺 U+1D5D（ᵝ）與 U+1DBD（ᶽ）兩個修飾字母，
   改以上標的 β／ʐ 呈現，音值完全等價。 */
var MODMAP = {'\u1d5d':'β', '\u1dbd':'\u0290'};
function plainMod(s){
  return String(s).replace(/\u1d5d/g,'β').replace(/\u1dbd/g,'\u0290');
}
function fixMods(root){
  if (!root) root = document.body;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), list=[], n_;
  while ((n_ = w.nextNode())){
    var p = n_.parentNode; if (!p) continue;
    var tag = p.nodeName;
    if (tag==='SCRIPT'||tag==='STYLE'||tag==='TITLE') continue;
    if (/\u1d5d|\u1dbd/.test(n_.nodeValue)) list.push(n_);
  }
  list.forEach(function(node){
    var s = node.nodeValue, frag = document.createDocumentFragment(), buf='', i, c, sp;
    for (i=0;i<s.length;i++){
      c = s.charAt(i);
      if (MODMAP[c] !== undefined){
        if (buf){ frag.appendChild(document.createTextNode(buf)); buf=''; }
        sp = document.createElement('span'); sp.className='mod';
        sp.textContent = MODMAP[c]; frag.appendChild(sp);
      } else buf += c;
    }
    if (buf) frag.appendChild(document.createTextNode(buf));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---------- 音節解析 ---------- */
var FINALS = {}; SCHEME.finals.forEach(function(f){FINALS[f]=1;});
var PAL = SCHEME.pal_map, ZERO = SCHEME.zero_map, PLAIN = SCHEME.plain;
var PAL_INIS = ['chi','shi','ci','ji'];
var HU_ORDER = SCHEME.hu_order;
var HU_KEY = {'開':'hu_kai','合':'hu_he','齊':'hu_qi','撮':'hu_cuo','特':'hu_te'};
var HU_GROUP = {};                    /* 韻 -> 陰聲/陽聲/入聲/特例 */
SCHEME.groups.forEach(function(g, gi){
  var nm = {'唇音':'grp_唇音','舌音':'grp_舌音','牙音':'grp_牙音',
            '腭音':'grp_腭音','齒音':'grp_齒音','喉音':'grp_喉音'}[g[0]] || g[0];
  SCHEME.groups[gi] = [nm, g[1]];
});
function huFull(hu){ return t(HU_KEY[hu]) + (hu==='特' ? '' : t('hu_suffix')); }
function huShort(hu){ var s = t(HU_KEY[hu]); return LANG==='en' ? s : s.charAt(0); }
var RH = SCHEME.rhymes;
/* 調類一律由 scheme.json 推出，不再手寫，免得數字跟實際調數脫節 */
var TONES_ALL = Object.keys(SCHEME.tone_info);
var TONES_SHU = SCHEME.shu_tones, TONES_RU = SCHEME.ru_tones;

/* 韵母 -> [韵序, 呼] */
var SLOT = {};
RH.forEach(function(rh, ri){
  rh.hus.forEach(function(h){
    h.finals.forEach(function(f){ SLOT[f.final] = [ri, h.hu]; });
  });
});

function parseSyl(s){
  if (s==='m'||s==='n'||s==='ng') return ['', s];
  for (var i=0;i<PAL_INIS.length;i++){
    var p=PAL_INIS[i];
    if (s.indexOf(p)===0){ var r=s.slice(p.length); return [p, PAL[r]!==undefined?PAL[r]:r]; }
  }
  for (var j=0;j<PLAIN.length;j++){
    var q=PLAIN[j];
    if (s.indexOf(q)===0) return [q, s.slice(q.length)];
  }
  if (ZERO[s]!==undefined) return ['', ZERO[s]];
  if (FINALS[s]) return ['', s];
  return null;
}

/* ---------- 两种数据源 -> 统一的小韵表 ---------- */
var CELLS = [], CELLKEY = {};
var META = {chars:0, records:0, syllables:0, skipped:0};

function addReading(syl, tone, ipa, ch){
  var p = parseSyl(syl);
  if (!p) { META.skipped++; return; }
  var ini=p[0], fin=p[1], slot=SLOT[fin];
  if (!slot) { META.skipped++; return; }
  var key = slot[0]+'|'+slot[1]+'|'+fin+'|'+ini+'|'+tone;
  var c = CELLKEY[key];
  if (!c){
    c = {ri:slot[0], hu:slot[1], fin:fin, ini:ini, tone:tone,
         ipa:[], chars:[], syl:syl+tone};
    CELLKEY[key]=c; CELLS.push(c);
  }
  if (c.ipa.indexOf(ipa)<0) c.ipa.push(ipa);
  if (ch && c.chars.indexOf(ch)<0) c.chars.push(ch);
}

function loadFromSnapshot(){
  CELLS=[]; CELLKEY={};
  META = {chars:SNAP.chars, records:SNAP.records, syllables:0, skipped:0};
  SNAP.cells.forEach(function(row){
    var ini=row[0], fin=row[1], tone=row[2], ipa=row[3], chars=row[4];
    var slot=SLOT[fin]; if(!slot) return;
    var c = {ri:slot[0], hu:slot[1], fin:fin, ini:ini, tone:tone,
             ipa:[ipa], chars:chars.split(''), syl:ini+fin+tone};
    CELLKEY[slot[0]+'|'+slot[1]+'|'+fin+'|'+ini+'|'+tone]=c; CELLS.push(c);
  });
  META.syllables = CELLS.length;
}

function loadFromLive(db){
  CELLS=[]; CELLKEY={};
  META = {chars:db.length, records:0, syllables:0, skipped:0};
  db.forEach(function(rec){
    var ch = rec.character, ms = rec.meaning || [];
    META.records += ms.length;
    ms.forEach(function(m){
      var mm = /^(.*?)([0-9])$/.exec(m[0]);
      if (!mm) { META.skipped++; return; }
      addReading(mm[1], mm[2], m[1]||'', ch);
    });
  });
  META.syllables = CELLS.length;
}

/* ---------- 代表字：按小韵字数升序贪心分配，尽量不重复 ---------- */
function assignReps(){
  var order = CELLS.slice().sort(function(a,b){return a.chars.length-b.chars.length;});
  var used = {};
  order.forEach(function(c){
    var rep = null;
    for (var i=0;i<c.chars.length;i++) if(!used[c.chars[i]]){rep=c.chars[i];break;}
    if (rep===null) rep = c.chars[0] || '';
    c.rep = rep; used[rep]=1;
  });
  CELLS.forEach(function(c){ if(!c.rep) c.rep = c.chars[0]||''; });
}

/* ---------- 呼位（韵 × 呼）索引 ---------- */
var UNIT = [];
function buildUnits(){
  UNIT = [];
  RH.forEach(function(rh, ri){
    rh.hus.forEach(function(h){
      var cells = CELLS.filter(function(c){return c.ri===ri && c.hu===h.hu;});
      var seen = {}, chars = [];
      cells.forEach(function(c){
        c.chars.forEach(function(x){ if(!seen[x]){seen[x]=1; chars.push(x);} });
      });
      UNIT.push({ri:ri, hu:h.hu, fin:h.finals[0].final, ipa:h.finals[0].ipa,
                 cells:cells, chars:chars, nSys:cells.length, nChar:chars.length});
    });
  });
}
function unitOf(ri,hu){
  for (var i=0;i<UNIT.length;i++) if(UNIT[i].ri===ri && UNIT[i].hu===hu) return UNIT[i];
  return null;
}
function huCount(){
  var c = {}; UNIT.forEach(function(u){ c[u.hu] = (c[u.hu]||0) + 1; }); return c;
}

/* ---------- 韻目名稱與中古來源 ---------- */
function rhName(rh){ return rh.name + t('word_rhyme'); }
function glossOf(ri){
  var g = GLOSS[LANG];
  return (g && g[ri]) ? g[ri] : RH[ri].src;
}

/* ---------- 静态骨架文字 ---------- */
function renderChrome(){
  document.title = t('page_title');
  document.getElementById('i-h1').innerHTML = t('h1')
    + ' <small>' + t('tagline') + '</small>';
  document.getElementById('i-based').innerHTML = n('based_on', {
    dict: '<a href="'+SCHEME.dict_url+'" target="_blank">'+esc(t('link_dict'))+'</a>',
    rime: '<a href="https://github.com/SiqYin/wugniu_suwu" target="_blank">'+esc(t('link_rime'))+'</a>',
    chars: META.chars, records: META.records, syll: META.syllables
  });

  document.getElementById('btnSync').textContent = t('btn_sync');
  document.getElementById('btnAll').textContent  = ALLOPEN ? t('btn_collapse') : t('btn_expand');
  document.getElementById('btnTop').textContent  = t('btn_top');
  document.getElementById('btnE').textContent    = hideEmpty ? t('btn_show') : t('btn_hide');
  document.getElementById('langCur').textContent = langLabel(LANG);
  /* 語言選單的三個名稱一律用同一個詞表（漢語／English／日本語），
     不管當前介面是哪一語，選項名稱都保持不變。 */
  document.getElementById('langMenu').querySelectorAll('button[data-lang]').forEach(function(b){
    b.textContent = langLabel(b.dataset.lang);
  });

  document.getElementById('i-sec-overview').textContent = t('sec_overview');
  document.getElementById('i-sec-rhymes').textContent   = t('sec_rhymes');
  document.getElementById('i-sec-units').textContent    = t('sec_units');
  document.getElementById('i-sec-yuntu').textContent    = t('sec_yuntu');
  document.getElementById('i-sec-bars').textContent     = t('sec_bars');
  document.getElementById('i-sec-notes').textContent    = t('sec_notes');

  function stat(v, label){ return '<div class="stat"><b>'+v+'</b><span>'+esc(label)+'</span></div>'; }
  document.getElementById('i-stats').innerHTML =
      stat(SCHEME.initial_order.length, t('st_initials'))
    + stat(SCHEME.finals.length, t('st_finals'))
    + stat(RH.length, t('st_rhymes'))
    + stat(UNIT.length, t('st_units'))
    + stat(TONES_ALL.length, n('st_tones', {shu: TONES_SHU.length, ru: TONES_RU.length}))
    + stat(META.syllables, t('st_cells'));

  /* 聲調表 */
  document.getElementById('i-tonetable').innerHTML =
    '<thead><tr><th>'+esc(t('th_no'))+'</th><th>'+esc(t('th_cls'))+'</th>'
    + '<th>'+esc(t('th_val'))+'</th><th>'+esc(t('th_kind'))+'</th></tr></thead><tbody>'
    + TONES_ALL.map(function(tn){
        var info = SCHEME.tone_info[tn], shu = info[2]==='舒';
        return '<tr><td class="num">'+tn+'</td><td>'+esc(t('tone_'+tn))+'</td>'
          + '<td class="ipa">'+info[1]+'</td><td style="background:'
          + (shu?'#e8f2fb':'#fdeeea')+'">'+esc(shu?t('kind_shu'):t('kind_ru'))+'</td></tr>';
      }).join('') + '</tbody>';
  document.getElementById('i-tonenote').textContent = n('tone_note', {total: TONES_ALL.length});

  /* 音系總覽要點 */
  var hc = huCount();
  var ovv = {rhymes:RH.length, units:UNIT.length, syll:META.syllables, chars:META.chars,
             n_kai:hc['開']||0, n_he:hc['合']||0, n_qi:hc['齊']||0,
             n_cuo:hc['撮']||0, n_te:hc['特']||0, btn_expand:t('btn_expand')};
  document.getElementById('i-ovlist').innerHTML =
    ['ov1','ov2','ov3','ov4','ov5','ov6','ov7','ov8','ov9']
      .map(function(k){ return '<li>'+n(k, ovv)+'</li>'; }).join('');

  document.getElementById('i-rt-note').innerHTML = t('rt_note');
  document.getElementById('i-ut-note').innerHTML = t('ut_note');
  document.getElementById('i-yt-note').innerHTML = n('ov9', ovv);
  document.getElementById('i-barsnote').textContent = t('bars_note');

  document.getElementById('i-notelist').innerHTML =
    ['n1','n2','n3','n4','n5','n6','n7','n8','n9']
      .map(function(k){ return '<p>'+n(k, ovv)+'</p>'; }).join('');

  document.getElementById('i-footer').innerHTML = n('footer', {
    rhymes: RH.length, units: UNIT.length, finals: SCHEME.finals.length,
    link: '<a href="'+SCHEME.dict_url+'" target="_blank">'+esc(t('link_dict'))+'</a>'
  });

  paintSync();
}

/* ---------- 韻圖 ---------- */
function toneList(rh){ return (rh.cls==='入聲韻') ? SCHEME.ru_tones : SCHEME.shu_tones; }

function yuntuTable(u){
  var rh = RH[u.ri];
  var tones = toneList(rh);
  var body = [];
  SCHEME.groups.forEach(function(g){
    body.push('<tr class="grp"><th colspan="'+(tones.length+1)+'">'+esc(t(g[0]))+'</th></tr>');
    g[1].forEach(function(ini){
      var tds = [], empty = true;
      tones.forEach(function(tn){
        var c = null;
        for (var i=0;i<u.cells.length;i++)
          if (u.cells[i].ini===ini && u.cells[i].tone===tn){c=u.cells[i];break;}
        if (c){
          empty = false;
          var tip = c.rep+'　'+c.syl+'　['+c.ipa.join('/')+']　'
                  + n('md_n_chars', {n:c.chars.length}) + '：'+c.chars.slice(0,80).join('');
          tds.push('<td class="c" data-tip="'+esc(tip)+'"><span class="ch">'+esc(c.rep)
                 + '</span><span class="py">'+esc(c.syl.slice(0,-1))+'</span></td>');
        } else tds.push('<td class="e">·</td>');
      });
      body.push('<tr class="inirow'+(empty?' alle':'')+'"><th class="ini">'+esc(ini||'∅')
        + '<span class="iv">'+SCHEME.initials[ini][2]+'</span></th>'+tds.join('')+'</tr>');
    });
  });
  return '<div class="yt" id="r-'+u.ri+'-'+u.hu+'"><div class="yt-h">'
    + '<span class="yt-t">'+esc(rh.name)+'<i>'+esc(huFull(u.hu))+'</i></span>'
    + '<span class="yt-f">'+u.fin+' <b>['+u.ipa+']</b></span>'
    + '<span class="yt-s">' + unitBtns(u.ri,u.hu,u) + '</span></div>'
    + '<div class="tw"><table class="yuntu"><thead><tr><th class="corner">'
    + esc(t('yt_corner'))+'</th>'
    + tones.map(function(tn){return '<th>'+esc(t('tone_'+tn))+'<span class="pt">'
        + SCHEME.tone_info[tn][1]+'</span></th>';}).join('')
    + '</tr></thead><tbody>'+body.join('')+'</tbody></table></div></div>';
}

function rhymeBlock(rh, ri){
  var nu = rh.hus.length, nSys = 0, nChar = 0;
  rh.hus.forEach(function(h){
    var u = unitOf(ri, h.hu); nSys += u.nSys; nChar += u.nChar;
  });
  var hus = rh.hus.map(function(h){
    var u = unitOf(ri, h.hu);
    return '<span class="rh-hu">'+esc(huFull(h.hu))+' <b>'+u.fin+'</b> [<span class="ipa">'
      + u.ipa + '</span>]</span>';
  }).join('');
  return '<div class="rh" id="rh-'+ri+'">'
    + '<div class="rh-head" data-ri="'+ri+'">'
    + '<span class="rh-caret">▶</span>'
    + '<span class="rh-name">'+esc(rhName(rh))+'</span>'
    + '<span class="rh-meta">'+esc(t('lbl_core'))+' ['+rh.core+'] ・ '
    + esc(t({'陰聲韻':'div_shu_short','陽聲韻':'div_shu_short',
              '入聲韻':'div_ru_short','特例韻':'div_te_short'}[rh.cls]))+' ・ '
    + esc(t('lbl_hu'))+' '+nu+' ・ '+esc(t('lbl_sys'))+' '+nSys
    + ' ・ '+esc(t('lbl_chars'))+' '+nChar+'</span>'
    + '<span class="rh-hus">'+hus+'</span>'
    + '<span class="rh-go">'+esc(t('rh_open'))+' ▼</span>'
    + '</div>'
    + '<div class="rh-body" id="rhb-'+ri+'"></div></div>';
}

/* 韻圖預設收合，展開時才即時繪製 */
var rhOpen = {}, ALLOPEN = false;

function renderRhymeBody(ri){
  var box = document.getElementById('rhb-'+ri);
  if (!box || box.dataset.done === '1') return;
  var rh = RH[ri], html = '';
  rh.hus.forEach(function(h){ html += yuntuTable(unitOf(ri, h.hu)); });
  box.innerHTML = '<p class="rsrc">'+esc(t('rh_label'))+'：<b>'+esc(rh.name)+'</b> ＝ '
    + esc(rh.label_read)+'；'+esc(t('rh_src'))+'：'+esc(glossOf(ri))+'</p>' + html;
  box.dataset.done = '1';
  applyHideEmpty(box);
  fixMods(box);
}

function expandRhyme(ri, noScroll){
  var d = document.getElementById('rh-'+ri);
  if (!d) return;
  renderRhymeBody(ri);
  d.classList.add('on'); rhOpen[ri] = 1;
  if (!noScroll) d.scrollIntoView({block:'nearest'});
}

function collapseRhyme(ri){
  var d = document.getElementById('rh-'+ri);
  if (!d) return;
  d.classList.remove('on'); rhOpen[ri] = 0;
}

function toggleRhyme(ri){
  var d = document.getElementById('rh-'+ri);
  if (!d) return;
  if (d.classList.contains('on')) collapseRhyme(ri); else expandRhyme(ri, true);
}

function allRhymes(open){
  RH.forEach(function(rh, ri){ if (open) expandRhyme(ri, true); else collapseRhyme(ri); });
  ALLOPEN = open;
  document.getElementById('btnAll').textContent = open ? t('btn_collapse') : t('btn_expand');
  return false;
}

function goUnit(ri, hu){
  expandRhyme(ri, true);
  var el = document.getElementById('r-'+ri+'-'+hu);
  if (el) el.scrollIntoView({block:'start'});
}

function renderYuntu(){
  var parts = [];
  function pick(cls){
    var a=[]; RH.forEach(function(r,i){ if(r.cls===cls) a.push([r,i]); }); return a;
  }
  function sum(arr){
    var cnt=arr.length, hu=0, sy=0, ch=0;
    arr.forEach(function(x){
      hu += x[0].hus.length;
      x[0].hus.forEach(function(h){
        var u = unitOf(x[1], h.hu); sy += u.nSys; ch += u.nChar;
      });
    });
    return {n:cnt, hu:hu, sy:sy, ch:ch};
  }
  var yin=pick('陰聲韻'), yang=pick('陽聲韻'), ru=pick('入聲韻'), te=pick('特例韻');
  var su = sum(yin.concat(yang));
  function meta(o){ return ' ・ ' + esc(t('lbl_hu')) + ' ' + o.hu + ' ・ '
    + esc(t('lbl_sys')) + ' ' + o.sy + ' ・ ' + esc(t('lbl_chars')) + ' ' + o.ch; }

  parts.push('<section class="sect broad"><h2 class="cstitle cls-shu">'+esc(t('yt_shu'))
    + ' <small>' + su.n + ' ・ ' + esc(t('div_shu_short')) + meta(su) + '</small></h2>'
    + '<p class="broadnote">' + t('yt_shu_note') + '</p>');

  [['陰聲韻','yt_yin','yt_yin_note','yin',yin],
   ['陽聲韻','yt_yang','yt_yang_note','yang',yang]].forEach(function(g){
    var s = sum(g[4]);
    parts.push('<h3 class="subcls cls-'+g[3]+'">'+esc(t(g[1]))
      + ' <small>'+esc(t(g[2]))+' ・ ' + s.n + meta(s) + '</small></h3>');
    g[4].forEach(function(x){ parts.push(rhymeBlock(x[0], x[1])); });
  });
  parts.push('</section>');

  var sru = sum(ru);
  parts.push('<section class="sect broad"><h2 class="cstitle cls-ru">'+esc(t('yt_ru'))
    + ' <small>' + sru.n + meta(sru) + '</small></h2>'
    + '<p class="broadnote">' + t('yt_ru_note') + '</p>');
  ru.forEach(function(x){ parts.push(rhymeBlock(x[0], x[1])); });
  parts.push('</section>');

  var ste = sum(te);
  parts.push('<section class="sect broad"><h2 class="cstitle cls-te">'+esc(t('yt_te'))
    + ' <small>' + ste.n + meta(ste) + '</small></h2>'
    + '<p class="broadnote">' + t('yt_te_note') + '</p>');
  te.forEach(function(x){ parts.push(rhymeBlock(x[0], x[1])); });
  parts.push('</section>');

  document.getElementById('sections').innerHTML = parts.join('');
}

function renderBars(){
  var top = UNIT.slice().sort(function(a,b){return b.nChar-a.nChar;}).slice(0,24);
  var max = top.length ? top[0].nChar : 1;
  document.getElementById('bars').innerHTML = top.map(function(u){
    return '<div class="bar-row"><span class="bl">'+esc(rhName(RH[u.ri]))+esc(huShort(u.hu))
      + '<i>'+u.fin+'</i></span><span class="bt"><i style="width:'
      + (u.nChar/max*100).toFixed(1)+'%"></i></span><span class="bn">'+u.nChar
      + '</span></div>';
  }).join('');
}

/* ---------- 彈窗：呼位 → 小韻一覽 → 某個小韻的全部字 ---------- */
function iniByOrder(a, b){
  return SCHEME.initial_order.indexOf(a.ini) - SCHEME.initial_order.indexOf(b.ini);
}

function showSysList(ri, hu){
  var u = unitOf(ri, hu), rh = RH[ri];
  var html = '<p class="mhint">' + n('md_hint_sys', {
    rhyme: esc(rhName(rh)), hu: esc(huFull(hu)), fin: u.fin, ipa: u.ipa,
    nsys: u.nSys }) + '</p>';
  toneList(rh).forEach(function(tn){
    var cs = u.cells.filter(function(c){return c.tone===tn;}).sort(iniByOrder);
    if (!cs.length) return;
    var cnt = 0; cs.forEach(function(c){ cnt += c.chars.length; });
    html += '<div class="mtone">' + n('md_tone_head', {
      name: esc(t('tone_'+tn)), no: tn, val: SCHEME.tone_info[tn][1],
      nsys: cs.length, nchars: cnt
    }) + '</div><table class="mtbl"><tbody>';
    cs.forEach(function(c){
      html += '<tr class="msysrow" data-ri="'+ri+'" data-hu="'+hu+'" data-ini="'
        + c.ini+'" data-tone="'+c.tone+'">'
        + '<td class="mi">'+esc(c.ini||'∅')+'<br><span style="font-size:10.5px;color:#8b95a1">'
        + SCHEME.initials[c.ini][2]+'</span></td>'
        + '<td class="mp">'+esc(c.syl)+'<br><span style="font-size:11px;color:#8b95a1">['
        + esc(c.ipa.join('/'))+']</span></td>'
        + '<td class="mc">'+esc(c.chars.slice(0,14).join(' '))
        + (c.chars.length>14 ? ' <span class="dim">'+esc(t('md_etc'))+'</span>' : '')+'</td>'
        + '<td class="mn">' + c.chars.length + ' ' + esc(t('word_char')) + '</td></tr>';
    });
    html += '</tbody></table>';
  });
  openModal(rhName(rh) + ' ' + huFull(hu),
            n('md_sys_sub', {fin:u.fin, ipa:u.ipa, nchars:u.nChar, nsys:u.nSys}), html, true);
  MODAL = {kind:'syslist', ri:ri, hu:hu};
}

function showSysChars(ri, hu, ini, tone){
  var u = unitOf(ri, hu), rh = RH[ri], c = null;
  for (var i=0;i<u.cells.length;i++)
    if (u.cells[i].ini===ini && u.cells[i].tone===tone){c=u.cells[i];break;}
  if (!c) return;
  var html = '<div class="mtone">'+esc(t('md_allchars'))
    + '<small>'+n('md_n_chars',{n:c.chars.length})+'</small></div>'
    + '<div class="syschars">'+esc(c.chars.join(' '))+'</div>';
  openModal(rhName(rh) + ' ' + huFull(hu) + '　' + c.syl,
            n('md_direct_sub', {nchars:c.chars.length}), html, false);
  MODAL = {kind:'syschars', ri:ri, hu:hu, ini:ini, tone:tone};
}

function showUnitAllChars(ri, hu){
  var u = unitOf(ri, hu), rh = RH[ri];
  var html = '<div class="mtone">' + n('md_allchars_head', {nchars:u.nChar, nsys:u.nSys})
    + '</div><div class="syschars">'+esc(u.chars.join(' '))+'</div>';
  toneList(rh).forEach(function(tn){
    var cs = u.cells.filter(function(c){return c.tone===tn;}).sort(iniByOrder);
    if (!cs.length) return;
    var cnt = 0; cs.forEach(function(c){ cnt += c.chars.length; });
    html += '<div class="mtone">' + n('md_tone_head', {
      name: esc(t('tone_'+tn)), no: tn, val: SCHEME.tone_info[tn][1],
      nsys: cs.length, nchars: cnt
    }) + '</div><table class="mtbl"><tbody>';
    cs.forEach(function(c){
      html += '<tr><td class="mi">'+esc(c.ini||'∅')
        + '<br><span style="font-size:10.5px;color:#8b95a1">'+SCHEME.initials[c.ini][2]
        + '</span></td><td class="mp">'+esc(c.syl)
        + '<br><span style="font-size:11px;color:#8b95a1">['
        + esc(c.ipa.join('/'))+']</span></td>'
        + '<td class="mc">'+esc(c.chars.join(' '))+'</td>'
        + '<td class="mn">'+c.chars.length+' '+esc(t('word_char'))+'</td></tr>';
    });
    html += '</tbody></table>';
  });
  openModal(rhName(rh) + ' ' + huFull(hu),
            n('md_sys_sub', {fin:u.fin, ipa:u.ipa, nchars:u.nChar, nsys:u.nSys}), html, false);
  MODAL = {kind:'unitall', ri:ri, hu:hu};
}

var CUR = null;            /* 目前彈窗所在的呼位，供「返回」用 */
var MODAL = null;          /* 目前彈窗的層級，供切換語言時重繪 */
function reopenModal(){
  if (!MODAL) return;
  if (MODAL.kind === 'syslist') showSysList(MODAL.ri, MODAL.hu);
  else if (MODAL.kind === 'unitall') showUnitAllChars(MODAL.ri, MODAL.hu);
  else showSysChars(MODAL.ri, MODAL.hu, MODAL.ini, MODAL.tone);
}
function openModal(title, sub, bodyHtml, isList){
  document.getElementById('mtitle').textContent = title;
  document.getElementById('msub').textContent = sub;
  document.getElementById('mbody').innerHTML = bodyHtml;
  document.getElementById('mback').style.display = isList ? 'none' : '';
  document.getElementById('mback').textContent = t('md_back');
  document.getElementById('mclose').textContent = t('md_close');
  document.getElementById('modal').classList.add('on');
  fixMods(document.getElementById('mbody'));
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }

document.addEventListener('click', function(e){
  var hd = e.target.closest('.rh-head');
  if (hd && !e.target.closest('button')){ toggleRhyme(+hd.dataset.ri); return; }

  var an = e.target.closest('a[href^="#r-"]');
  if (an){
    var m = an.getAttribute('href').match(/^#r-(\d+)(?:-(.+))?$/);
    if (m){
      e.preventDefault();
      if (m[2]) goUnit(+m[1], m[2]); else expandRhyme(+m[1]);
      return;
    }
  }
  var b = e.target.closest('button.sys');
  if (b){
    CUR = {ri:+b.dataset.ri, hu:b.dataset.hu};
    showSysList(CUR.ri, CUR.hu); return;
  }
  var c = e.target.closest('button.cnt');
  if (c){
    CUR = {ri:+c.dataset.ri, hu:c.dataset.hu};
    showUnitAllChars(CUR.ri, CUR.hu); return;
  }
  var row = e.target.closest('tr.msysrow');
  if (row){
    CUR = {ri:+row.dataset.ri, hu:row.dataset.hu};
    showSysChars(CUR.ri, row.dataset.hu, row.dataset.ini, row.dataset.tone); return;
  }
  if (e.target.closest('#mback')){
    if (CUR) showSysList(CUR.ri, CUR.hu);
    return;
  }
  if (e.target.id==='modal' || e.target.closest('#mclose')) closeModal();
});
document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeModal(); });

document.addEventListener('mouseover', function(e){
  var td = e.target.closest('td.c');
  if (!td) return;
  var tip = document.getElementById('tip');
  tip.textContent = plainMod(td.dataset.tip); tip.style.display = 'block';
});
document.addEventListener('mousemove', function(e){
  var tip = document.getElementById('tip');
  if (tip.style.display !== 'block') return;
  var x = e.clientX+14, y = e.clientY+16, r = tip.getBoundingClientRect();
  if (x+r.width > innerWidth-10) x = e.clientX-r.width-14;
  if (y+r.height > innerHeight-10) y = e.clientY-r.height-16;
  tip.style.left = x+'px'; tip.style.top = y+'px';
});
document.addEventListener('mouseout', function(e){
  if (e.target.closest('td.c')) document.getElementById('tip').style.display='none';
});

/* ---------- 同步狀態條 ---------- */
var SYNC = {type:'loading', data:{}};
function paintSync(){
  var el = document.getElementById('syncbar'), cls = 'builtin', html = '';
  if (SYNC.type === 'loading'){
    html = '<span class="dot">⏳</span><span>'+esc(t('sync_loading'))+'</span>';
  } else if (SYNC.type === 'ok'){
    cls = 'ok';
    html = '<span class="dot">✅</span><span>' + n('sync_ok', {
      link: '<a href="'+SCHEME.dict_url+'" target="_blank">'+esc(t('link_dict'))+'</a>',
      chars: META.chars, records: META.records, syll: META.syllables,
      stamp: SYNC.data.stamp ? n('sync_ok_stamp', {t:SYNC.data.stamp}) : ''
    }) + '</span>';
  } else {
    html = '<span class="dot">⚠️</span><span>' + n('sync_fail', {
      err: esc(SYNC.data.err||''), chars: META.chars, records: META.records }) + '</span>';
  }
  el.className = 'syncbar ' + cls;
  el.innerHTML = html;
}

function fmtDate(s){
  if (!s) return '';
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  function p(x){ return (x<10?'0':'')+x; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '
       + p(d.getHours())+':'+p(d.getMinutes());
}

function sync(){
  SYNC = {type:'loading', data:{}}; paintSync();
  fetch(SCHEME.live_url, {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    var stamp = r.headers.get('last-modified') || '';
    return r.json().then(function(db){ return {db:db, stamp:stamp}; });
  }).then(function(res){
    loadFromLive(res.db); renderAll();
    SYNC = {type:'ok', data:{stamp: fmtDate(res.stamp)}}; paintSync();
  }).catch(function(err){
    loadFromSnapshot(); renderAll();
    SYNC = {type:'fail', data:{err: err.message || String(err)}}; paintSync();
  });
}

/* ---------- 渲染與語言切換 ---------- */
function renderAll(){
  assignReps(); buildUnits();
  renderChrome(); renderRhymeTable(); renderUnitTable(); renderYuntu(); renderBars();
  fixMods(document.body);
}

function applyLang(l){
  if (!I18N[l]) l = 'wu';
  LANG = l;
  document.documentElement.lang = (l === 'wu') ? 'zh-Hant' : l;
  /* 已展開的韻圖要重繪（文字換語言） */
  var opened = [];
  RH.forEach(function(rh, ri){ if (rhOpen[ri]) opened.push(ri); });
  RH.forEach(function(rh, ri){
    var box = document.getElementById('rhb-'+ri);
    if (box){ box.dataset.done = '0'; box.innerHTML = ''; }
  });
  document.querySelectorAll('#langMenu button').forEach(function(b){
    b.classList.toggle('cur', b.dataset.lang === l);
  });
  renderAll();
  opened.forEach(function(ri){ expandRhyme(ri, true); });
  if (document.getElementById('modal').classList.contains('on')) reopenModal();
}

/* 先把內建快照渲染出來，再嘗試聯網更新；語言同步判定 */
loadFromSnapshot();
buildUnits(); assignReps();
if (!window.__yuntuLang.ready(applyLang)) applyLang('wu');
sync();
</script>
